[package]
name = "extract"
description = "Reads the words out of files: text and code, Office and OpenDocument, PDF, EPUB, HTML, RTF, email, notebooks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
winsys.workspace = true
windows.workspace = true
serde_json.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
mail-parser = "1"
cfb = "0.15"
pdfium-render = { version = "0.9", default-features = false, features = ["thread_safe", "pdfium_latest", "image_025"] }
